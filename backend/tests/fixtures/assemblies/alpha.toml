[assembly]
name = "alpha"
application_code = "alpha"
[frontend]
enabled_route_groups = ["alpha", "auth", "home", "system", "platform", "user-profile", "exception"]
[features]
flags = { control_sso_client = true, control_tenant_provisioning = true, control_user_access_sync = true, control_user_access_enforcement = true }
[federation.default_role]
mode = "declared"
permission_prefixes = ["module_alpha"]
