# 示例：部署前配置真实域名、证书和前端目录。
upstream fastapiadmin_control_backend {
    server 127.0.0.1:8100;
    keepalive 32;
}

server {
    listen 443 ssl http2;
    server_name control.example.com;

    # ssl_certificate /etc/nginx/ssl/<host>/fullchain.pem;
    # ssl_certificate_key /etc/nginx/ssl/<host>/privkey.pem;
    root /srv/fastapiadmin/control/web;

    location /api/ {
        proxy_pass http://fastapiadmin_control_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
